<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circular badge -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)" />
  <!-- Protective Guardian Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#shieldGrad)" stroke-width="6" opacity="0.8" />
  <!-- Center Water Droplet with filtration ripple -->
  <path d="M256 90 C256 90 140 240 140 330 C140 395 192 445 256 445 C320 445 372 395 372 330 C372 240 256 90 256 90 Z" 
        fill="#38bdf8" filter="url(#glow)" opacity="0.95" />
  <!-- Filtration waves inside droplet -->
  <path d="M190 335 Q225 320 256 335 T322 335" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.85" />
  <path d="M205 375 Q230 365 256 375 T307 375" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" opacity="0.75" />
  <!-- Sparkle point -->
  <circle cx="225" cy="210" r="14" fill="#ffffff" opacity="0.7" />
</svg>
